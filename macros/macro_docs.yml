version: 2

macros:
  - name: extract_financial_year
    description: |
      Extracts the Australian financial year from a given date expression.
      The Australian financial year runs from July 1 to June 30.

      **Returns**
      string representing the financial year (e.g., 2025-2026 for FY 2025-2026)

      **Examples**
      - '2025-01-15' → 2024-2025
      - '2025-06-30' → 2024-2025
      - '2025-07-01' → 2025-2026
      - '2025-12-31' → 2025-2026 

      **Usage**
      ```
      \{\{ extract_financial_year('transaction_date') }}
      \{\{ extract_financial_year("'2025-07-28'") }}
      \{\{ extract_financial_year('max(updated_at)') }}
      ```

    arguments:
      - name: date
        type: string
        description: | 
          A date expression that can be parsed by SQL extract functions.Can be a column reference, literal date, or function call. Examples: 'created_at', "'2025-07-28'", 'CURRENT_DATE'
     