version: 2

models:
  - name: issues
    config:
      meta:
        base_date: "2014-01-01"
        alation_oid: oid=4889;otype=table
        alation_title: Issues
    description: <div><p>The Issues table contains data from Jira, a popular issue
      tracking and project management tool. It stores information about various
      issues or tickets raised in Jira, likely related to software development
      or IT operations.</p></div>
    columns:
      - name: extracted
        description: The timestamp indicating when a record was inserted into
          the target table, generated by the system at the time of loading.
        config:
          meta:
            alation_oid: oid=124403;otype=attribute
            alation_title: Inserted At

      - name: id
        description: The unique identifier of the issue.
        config:
          meta:
            alation_oid: oid=124240;otype=attribute
            alation_title: Issue Id

      - name: payload
        description: Variant data type containing all the fields information about
          a particular issue, including any custom fields.
        config:
          meta:
            alation_oid: oid=124948;otype=attribute
            alation_title: Issue Data

  - name: permissions
    description: <div><p>The Permissions table stores permission keys and associated
      data for the Jira application, which is used for access control and authorization
      purposes within the Jira system.</p></div>
    config:
      meta:
        alation_oid: oid=4873;otype=table
        alation_title: Permissions
    columns:
      - name: extracted
        description: The timestamp indicating when a record was inserted into
          the target table, generated by the system at the time of loading.
        config:
          meta:
            alation_oid: oid=124623;otype=attribute
            alation_title: Inserted At

      - name: id
        description: The key of the permission.
        config:
          meta:
            alation_oid: oid=124898;otype=attribute
            alation_title: Permission Key

      - name: payload
        description: "<div><p>Permissions data is a variant column containing\
          \ the description of the permission, the permission key, the name of\
          \ the permission and the type of permission.</p><p>Example:\_</p><p\
          \ id=\"isPasted\">{</p><p>\_ \"description\": \"Ability to administer\
          \ a project in Jira.\",</p><p>\_ \"key\": \"ADMINISTER_PROJECTS\",</p><p>\_\
          \ \"name\": \"Administer Projects\",</p><p>\_ \"type\": \"PROJECT\"\
          </p><p>}</p></div>"
        config:
          meta:
            alation_oid: oid=124337;otype=attribute
            alation_title: Permission Data

  - name: vw_issues
