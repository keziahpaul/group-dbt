        description: "<div><p>Column added due to process in Snowflake. \n</p><p>The\
          \ column name SYS_MV_SOURCE_PARTITION typically appears in the context of\
          \ materialized views or database systems. It is often associated with internal\
          \ system-generated metadata used to manage partitioning in materialized\
          \ views.</p></div>"
        config:
          meta:
            alation_oid: oid=124977;otype=attribute
            alation_title: Sys Mv Source Partition

      - name: type
        description: "<div><p>Permission type.</p><p>Details of the user's permissions\
          \ can be obtained in a global, project, issue or comment context.</p><p>1.<strong>\_\
          Global:</strong> user has the project permission in any project.</p><p>2.\
          \ <strong>Project:\_</strong></p><p><span id=\"isPasted\" style=\"\">Where\
          \ the project permission is determined using issue data, if the user meets\
          \ the permission's criteria for any issue in the project. Otherwise, if\
          \ the user has the project permission in the project.</span></p><p><span\
          \ id=\"isPasted\">3. <strong>Issue:</strong></span></p><p><span>Where a\
          \ project permission is determined using issue data, if the user has the\
          \ permission in the issue. Otherwise, if the user has the project permission\
          \ in the project containing the issue.</span></p><p><span><strong>4. Comment:</strong></span></p><p><span>Where\
          \ the user has both the permission to browse the comment and the project\
          \ permission for the comment's parent issue. Only the BROWSE_PROJECTS permission\
          \ is supported.</span></p></div>"
        config:
          meta:
            alation_oid: oid=124680;otype=attribute
            alation_title: Type
