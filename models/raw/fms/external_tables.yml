          pattern: .*\.parquet
          integration: FMS_AZURE_NOTIFICATION_INTEGRATION
          partitions:
            - name: timestamp_folder
              data_type: VARCHAR
              expression: SPLIT_PART(SPLIT_PART(METADATA$FILENAME, '/', 3), '=', 2)
        columns:
          - name: Id
            description: Unique identifier of the company
            data_type: varchar(36)
            data_tests:
              - unique

              - not_null

          - name: SinkCreatedOn
            description: Timestamp when the record was created in the sink
            data_type: varchar

          - name: SinkModifiedOn
            description: Timestamp when the record was last modified in the sink
            data_type: varchar

