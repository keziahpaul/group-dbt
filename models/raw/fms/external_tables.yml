          - name: jurisdiction
            description: Code or identifier for the export control jurisdiction
            data_type: VARCHAR

          - name: modifieddatetime
            description: Timestamp of last modification
            data_type: VARCHAR

          - name: modifiedby
            description: User who last modified the record
            data_type: VARCHAR

          - name: modifiedtransactionid
            description: Transaction ID of the last modification
            data_type: VARCHAR

          - name: createddatetime
            description: Timestamp when the record was created
            data_type: VARCHAR

          - name: createdby
            description: User who created the record
            data_type: VARCHAR

          - name: createdtransactionid
            description: Transaction ID of the record creation
            data_type: VARCHAR

          - name: dataareaid
            description: Identifier for the data area
            data_type: VARCHAR

          - name: recversion
            description: Version number of the record
            data_type: VARCHAR

          - name: partition
            description: Partition identifier for the record
            data_type: VARCHAR

          - name: sysrowversion
            description: System row version number
            data_type: VARCHAR

          - name: recid
            description: Unique record identifier in the system
            data_type: VARCHAR

          - name: tableid
            description: Identifier for the database table
            data_type: VARCHAR

          - name: versionnumber
            description: Version number of the record
            data_type: VARCHAR

          - name: createdon
            description: Date when the record was created
            data_type: VARCHAR

          - name: modifiedon
            description: Date when the record was last modified
            data_type: VARCHAR

          - name: IsDelete
            description: Flag indicating if the record is marked for deletion
            data_type: BOOLEAN

