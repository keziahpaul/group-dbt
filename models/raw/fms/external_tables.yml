      - name: cooexportcontroljurisdictioninuse
        description: External table for Export Control Jurisdiction Usage
        external:
          location: "@{{env_var('DBT_GROUP_RAW_DB')}}.FMS.FMS_AZURE_INBOUND_STAGE/deltalake/cooexportcontroljurisdictioninuse_partitioned"
          file_format: "{{env_var('DBT_GROUP_RAW_DB')}}.FMS.PARQUET_FILE_FORMAT"
          pattern: .*\.parquet
          integration: FMS_AZURE_NOTIFICATION_INTEGRATION
          partitions:
            - name: timestamp_folder
              data_type: VARCHAR
              expression: SPLIT_PART(SPLIT_PART(METADATA$FILENAME, '/', 3), '=', 2)
        columns:
          - name: Id
            description: Primary key - Unique identifier for the export control jurisdiction
              record
            data_type: VARCHAR(36)

          - name: SinkCreatedOn
            description: Timestamp when the record was created in the data sink
            data_type: VARCHAR

          - name: SinkModifiedOn
            description: Timestamp when the record was last modified in the data sink
            data_type: VARCHAR

          - name: isactive
            description: Flag indicating if the jurisdiction control is currently
              active
            data_type: VARCHAR

          - name: skipsalesordercheck
            description: Flag indicating whether to bypass export control checks for
              sales orders
            data_type: VARCHAR

          - name: skipsalesquotationcheck
            description: Flag indicating whether to bypass export control checks for
              sales quotations
            data_type: VARCHAR

          - name: sysdatastatecode
            description: System state code for data management
