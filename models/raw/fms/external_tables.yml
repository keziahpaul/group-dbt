      - name: vendtrans
        description: External table for Vendor Transactions
        external:
          location: "@{{env_var('DBT_GROUP_RAW_DB')}}.FMS.FMS_AZURE_INBOUND_STAGE/deltalake/vendtrans_partitioned"
          file_format: "{{env_var('DBT_GROUP_RAW_DB')}}.FMS.PARQUET_FILE_FORMAT"
          pattern: .*\.parquet
          integration: FMS_AZURE_NOTIFICATION_INTEGRATION
          partitions:
            - name: timestamp_folder
              data_type: VARCHAR
              expression: SPLIT_PART(SPLIT_PART(METADATA$FILENAME, '/', 3), '=', 2)
        columns:
          - name: Id
            description: Primary key - Unique identifier for the vendor transaction
            data_type: VARCHAR(36)

          - name: SinkCreatedOn
            description: Timestamp when record was created in the data sink
            data_type: VARCHAR

          - name: SinkModifiedOn
            description: Timestamp when record was last modified in the data sink
