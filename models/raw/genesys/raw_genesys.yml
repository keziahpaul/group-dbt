version: 2

models:
  - name: et_seeds
    description: This ephemeral table is used for testing the Genesys configuration details
    data_tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          name: _genesys_config
          arguments:
            compare_model: ref("_genesys_config")

  - name: conversation
    description: Calls the [Analytics / Get conversation details asynchronously](https://developer.genesys.cloud/analyticsdatamanagement/analytics/analytics-apis#post-api-v2-analytics-conversations-details-jobs)
      API to retrieve conversation details. You can configure how far back
      you want to retrieve data by setting the `base_date` configuration item.
      This only affects the initial full refresh of this table, incremental
      refreshes will always pull data the data since the last loaded date.
      Given the API will only retrieve a maximum of 100 days worth of data,
      if you set this date to far into the past, 100 days or more prior to
      the first recorded conversation, no data will be returned, and this
      table will never get populated.
    config:
      meta:
        base_date: "2021-01-01"
    columns:
      - name: extracted
        data_type: timestamp_tz
        description: The timestamp indicating when a record was inserted into
          the target table, generated by the system at the time of loading.
      - name: id
        data_type: string
        description: The unique identifier for this table.
      - name: payload
        data_type: variant
        description: Variant data type containing the API response for each record.

  - name: global_queue_aggregate
    description: Calls the [Analytics / Get conversation aggregates](https://developer.genesys.cloud/analyticsdatamanagement/analytics/analytics-apis#post-api-v2-analytics-conversations-aggregates-query)
      API to retrieve queue aggregates. The API only allows for the retrieval of
      aggregate data back a maximum of 5 years. You can configure how far back
      you want to retrieve data by setting the `max_years` configuration item.
      This only affects the initial full refresh of this table, incremental
      refreshes will always pull data the data since the last loaded date.
    config:
      meta:
        max_years: 5
    columns:
      - name: extracted
        data_type: timestamp_tz
        description: The timestamp indicating when a record was inserted into
          the target table, generated by the system at the time of loading.
      - name: id
        data_type: string
        description: The unique identifier for this table.
      - name: payload
        data_type: variant
        description: Variant data type containing the API response for each record.

  - name: queue_aggregate
    description: Calls the [Analytics / Get conversation aggregates](https://developer.genesys.cloud/analyticsdatamanagement/analytics/analytics-apis#post-api-v2-analytics-conversations-aggregates-query)
      API to retrieve queue aggregates. The API only allows for the retrieval of
      aggregate data back a maximum of 5 years. You can configure how far back
      you want to retrieve data by setting the `max_years` configuration item.
      This only affects the initial full refresh of this table, incremental
      refreshes will always pull data the data since the last loaded date.
    config:
      meta:
        max_years: 5
    columns:
      - name: extracted
        data_type: timestamp_tz
        description: The timestamp indicating when a record was inserted into
          the target table, generated by the system at the time of loading.
      - name: id
        data_type: string
        description: The unique identifier for this table.
      - name: payload
        data_type: variant
        description: Variant data type containing the API response for each record.

  - name: queue
    description: Calls the [Routing / Get queues paginated](https://developer.genesys.cloud/routing/routing/#get-api-v2-routing-queues)
      API to retrieve queues
    columns:
      - name: extracted
        data_type: timestamp_tz
        description: The timestamp indicating when a record was inserted into
          the target table, generated by the system at the time of loading.
      - name: id
        data_type: string
        description: The unique identifier for this table.
      - name: payload
        data_type: variant
        description: Variant data type containing the API response for each record.

  - name: rg_user
    description: Calls the [Users / Get users paginated](https://developer.genesys.cloud/useragentman/users/#get-api-v2-users)
      API to retrieve users
    config:
      alias: "user"
    columns:
      - name: extracted
        data_type: timestamp_tz
        description: The timestamp indicating when a record was inserted into
          the target table, generated by the system at the time of loading.
      - name: id
        data_type: string
        description: The unique identifier for this table.
      - name: payload
        data_type: variant
        description: Variant data type containing the API response for each record.

  - name: wrap_up_code
    description: Calls the [Routing / Get wrap-up codes paginated](https://developer.genesys.cloud/routing/routing/#get-api-v2-routing-wrapupcodes)
      API to retrieve wrap-up codes
    columns:
      - name: extracted
        data_type: timestamp_tz
        description: The timestamp indicating when a record was inserted into
          the target table, generated by the system at the time of loading.
      - name: id
        data_type: string
        description: The unique identifier for this table.
      - name: payload
        data_type: variant
        description: Variant data type containing the API response for each record.



