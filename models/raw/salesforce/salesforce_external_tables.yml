      - name: email_message
        description: Object used for managing email correspondence
        external:
          location: "@{{env_var('DBT_GROUP_RAW_DB')}}.{{env_var('DBT_SALESFORCE_RAW_SCHEMA')}}.{{env_var('DBT_ENV_NAME')}}_INGRESS_SALESFORCE_INBOUND_STAGE/emailmessage/onedata_salesforce_data_ingress_EmailMessage_{{env_var('DBT_ENV_NAME')}}/"
          file_format: "{{env_var('DBT_GROUP_RAW_DB')}}.{{env_var('DBT_SALESFORCE_RAW_SCHEMA')}}.json_file_format"
          partitions:
            - name: year_c
              data_type: NUMBER
              expression: to_number(split_part(METADATA$FILENAME, '/', 5))

            - name: month_c
              data_type: NUMBER
              expression: to_number(split_part(METADATA$FILENAME, '/', 6))

            - name: date_c
              data_type: NUMBER
              expression: to_number(split_part(METADATA$FILENAME, '/', 7))
        columns:
          - name: ActivityId
            data_type: VARCHAR
            description: Activity Id
          - name: BccAddress
            data_type: VARCHAR
            description: Email BCC Addresses
          - name: CcAddress
            data_type: VARCHAR
            description: Email CC Addresses
          - name: ClientThreadIdentifier
            data_type: VARCHAR
            description: Client Email Thread Identifier
          - name: CreatedById
            data_type: VARCHAR
            description: Created By
          - name: CreatedDate
            data_type: VARCHAR
            description: Created Date
          - name: FirstOpenedDate
            data_type: VARCHAR
            description: First Opened Date
          - name: FromAddress
            data_type: VARCHAR
            description: Email From Address
          - name: FromName
            data_type: VARCHAR
            description: Email From entity name
          - name: HasAttachment
            data_type: VARCHAR
            description: Email has an attachment
          - name: Headers
            data_type: VARCHAR
            description: Email Headers
          - name: HtmlBody
            data_type: VARCHAR
            description: HTML Body for the email
          - name: Id
            data_type: VARCHAR
            description: Id
          - name: Incoming
            data_type: VARCHAR
            description: Incoming
          - name: IsBounced
            data_type: VARCHAR
            description: Email is bounced
          - name: IsClientManaged
            data_type: VARCHAR
            description: Is Client Managed
          - name: IsDeleted
            data_type: VARCHAR
            description: Is Deleted
          - name: IsExternallyVisible
            data_type: VARCHAR
            description: Is Externally Visible
          - name: IsOpened
            data_type: VARCHAR
            description: Is Opened
          - name: IsTracked
            data_type: VARCHAR
            description: Is Tracked
          - name: LastModifiedById
            data_type: VARCHAR
            description: Last Modified By Id
          - name: LastModifiedDate
            data_type: VARCHAR
            description: Last Modified Date
          - name: LastOpenedDate
            data_type: VARCHAR
            description: Last Opened Date
          - name: MessageDate
            data_type: VARCHAR
            description: Message Date
          - name: MessageIdentifier
            data_type: VARCHAR
            description: Message Identifier
          - name: Name
            data_type: VARCHAR
            description: Name of email template
          - name: ParentId
            data_type: VARCHAR
            description: Parent Id
          - name: RelatedToId
