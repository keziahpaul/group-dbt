      - name: all_survey_responses__c
        description: <div><p>The All Survey Responses table contains survey response
          data collected from PEXA customers, including satisfaction ratings, comments,
          and feedback on various aspects of PEXA's products and services.</p></div>
        external:
          location: "@{{env_var('DBT_GROUP_RAW_DB')}}.{{env_var('DBT_SALESFORCE_RAW_SCHEMA')}}.{{env_var('DBT_ENV_NAME')}}_INGRESS_SALESFORCE_INBOUND_STAGE/inbound/all_survey_responses__c/onedata_salesforce_data_ingress_All_Survey_Responses__c_{{env_var('DBT_ENV_NAME')}}/"
