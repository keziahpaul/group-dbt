    description: "View created based on table\_<a href=\"https://onedd-pexa.ap.alationcloud.com/app/table/5206/overview\"\
      \ id=\"isPasted\">All Survey Responses | Table</a>."
    columns:
      - name: access_to_online_training_materials__c
        description: This is a 5 point rating from 1 to 5 where customers rate how
          satisfied they are with access to online training materials.
        config:
          meta:
            alation_oid: oid=122473;otype=attribute
            alation_title: Access to Online Training Materials

      - name: am_comments__c
        description: This is a restricted field. This contains comments left by a
          customer about their account owner.
        config:
          meta:
            alation_oid: oid=122073;otype=attribute
            alation_title: Account Manager Comments

      - name: am_dissatisfied_bottom_2__c
        description: This is a calculation showing customers who rated 1 or 2 out
          of 5 on account owner satisfaction.
        config:
          meta:
            alation_oid: oid=122707;otype=attribute
            alation_title: Account Manager Dissatisfied Bottom 2

      - name: am_easy_to_deal__c
        description: This is a 5 point rating from 1 to 5 where customers rate how
          easy it is to deal with their account owner. This should not be reported
          at an individual level but at an aggregate only.
        config:
          meta:
            alation_oid: oid=122623;otype=attribute
            alation_title: Account Manager Easy to deal with

      - name: am_focused_on_delivering_better_outcomes__c
        description: This is a 5 point rating from 1 to 5 where customers rate how
          satisfied they are with their account owner delivering better outcomes for
          their business. This should be reported as an aggregate not individual score.
        config:
          meta:
            alation_oid: oid=121408;otype=attribute
            alation_title: Account Manager focused on Delivering Better outcomes

      - name: am_interest_in_business_needs__c
        description: This is a 5 point rating from 1 to 5 where customers rate their
          account owner on how much interest they shown in their business. This is
          restricted and should not be reported at an individual level.
        config:
          meta:
            alation_oid: oid=121593;otype=attribute
            alation_title: Account Manager interest in Business Needs

      - name: am_neutral__c
        description: This is a calculation showing customers who rated 3 out of 5
          on account owner satisfaction.
        config:
          meta:
            alation_oid: oid=121904;otype=attribute
            alation_title: Account Manager Neutral

      - name: am_proactive__c
        description: Account Manager Proactive
        config:
          meta:
            alation_oid: oid=120919;otype=attribute
            alation_title: Account Manager Proactive

      - name: am_provides_solutions__c
        description: This is a 5 point rating from 1 to 5 where customers rate how
          satisfied they are with their account owner providing solutions. This should
          not be reported as an individual score but as an aggregate.
        config:
          meta:
            alation_oid: oid=123018;otype=attribute
