version: 2

models:
  - name: pbi_pexa_client_activity
    description: The table provides detailed information relevant to PEXA for individuals
      or business register at Send platform to perform a trade.
    columns:
      - name: Affiliate_Branch
        description: The affiliate employee's branch of the registration.
        config:
          tags:
            - secure_field=PI_BUSINESS_NAME
          meta:
            alation_oid: oid=58902;otype=attribute
            alation_title: Affiliate Branch

      - name: Business_Name
        description: The name of the business.
        config:
          tags:
            - secure_field=PI_BUSINESS_NAME
          meta:
            alation_oid: oid=59532;otype=attribute
            alation_title: Business Name

      - name: Affiliate_Employee
        description: The affiliate employee of the registration.
        config:
          tags:
            - secure_field=PI_FULL_NAME
          meta:
            alation_oid: oid=59972;otype=attribute
            alation_title: Affiliate Employee

      - name: Full_Name
        description: The full name of the registration.
        config:
          tags:
            - secure_field=PI_FULL_NAME
          meta:
            alation_oid: oid=60211;otype=attribute
            alation_title: Full Name

      - name: Registration_Account_Manager
        description: The account manager of the Registration.
        config:
          tags:
            - secure_field=PI_FULL_NAME
          meta:
            alation_oid: oid=59031;otype=attribute
            alation_title: Registration Account Manager

      - name: Registration_Account_Manager_Email
        description: The email address of the account manager.

        config:
          tags:
            - secure_field=PI_EMAIL
      - name: abn_acn
        description: The unique identifier number of the business in Australia.
        config:
          meta:
            alation_oid: oid=59781;otype=attribute
            alation_title: Australian Business Number Australian Company Number

      - name: day_of_lead_created_date_aest
        description: The date of the lead is created in Newton.
        config:
          meta:
            alation_oid: oid=60182;otype=attribute
            alation_title: Day of Lead Created Date AEST

      - name: day_of_registration_date_aest
        description: The date of the registration is created in Newton.
        config:
          meta:
            alation_oid: oid=59313;otype=attribute
            alation_title: Day of Registration Date AEST

      - name: domain_email_address
        description: The customer's email domain address.
        config:
          meta:
            alation_oid: oid=58787;otype=attribute
            alation_title: Domain Email Address

      - name: effective_from
        description: Timestamp from when the record became the active records as part
          of SCD2. SCD2 stands for Slowly Changing Dimensions 2
        config:
          meta:
            alation_oid: oid=60119;otype=attribute
            alation_title: Effective From

      - name: effective_to
        description: Timestamp from when the record was replaced with a more up to
          date record as part of SCD2. SCD2 stands for Slowly Changing Dimensions
          2.
        config:
          meta:
            alation_oid: oid=59414;otype=attribute
            alation_title: Effective To

      - name: etl_insert_date_aest
        description: Audit field, record insert date in AEST.
        config:
          meta:
            alation_oid: oid=59497;otype=attribute
            alation_title: ETL Insert Date AEST

      - name: etl_insert_date_utc
        description: Audit field, record insert date in UTC.
        config:
          meta:
            alation_oid: oid=60025;otype=attribute
            alation_title: ETL Insert Date UTC

      - name: inserted_at
        description: Timestamp when data was inserted into curate layer.
        config:
          meta:
            alation_oid: oid=58638;otype=attribute
            alation_title: Inserted At

      - name: key_hash
        description: A unique identifier generated by hashing the Primary Key columns
          of a record, ensuring each record can be uniquely identified even if the
          primary key consists of multiple columns.
        config:
          meta:
            alation_oid: oid=59606;otype=attribute
            alation_title: Key Hash

      - name: master_registration_id
        description: "This field shows the Original Registration ID that was cloned\
          \ to create a new registration for \u201CAPI\u201D."
        config:
          meta:
            alation_oid: oid=60120;otype=attribute
            alation_title: Master Registration Id

      - name: max_trade_settled_for_accounting_date
        description: Latest Date of the last trade settled for accounting
        config:
          meta:
            alation_oid: oid=59132;otype=attribute
            alation_title: Max Trade Settled For Accounting Date

      - name: min_trade_settled_for_accounting_date
        description: Earliest Date of the last trade settled for accounting
        config:
          meta:
            alation_oid: oid=59418;otype=attribute
            alation_title: Min Trade Settled For Accounting Date

      - name: purpose
        description: The purpose of the registration.
        config:
          meta:
            alation_oid: oid=58762;otype=attribute
            alation_title: Purpose

      - name: registration_created_source
        description: "This field is used to determine if the registration was created\
          \ by \u201CAPI\u201D or by \u201CReferral\u201D."
        config:
          meta:
            alation_oid: oid=58642;otype=attribute
            alation_title: Registration Created Source

      - name: registration_id
        description: The unique identifier of the registrationrecord.
        config:
          meta:
            alation_oid: oid=59455;otype=attribute
            alation_title: Registration Id

      - name: registrations_pexa_opt_in_date_aest
        description: Incentive program start date Australian Eastern Standard Time
        config:
          meta:
            alation_oid: oid=59820;otype=attribute
            alation_title: Registrations Pexa Opt In Date AEST

      - name: registrations_pexa_opt_in_flag
        description: Flag to indicate the registration is part of incentive program.
        config:
          meta:
            alation_oid: oid=59716;otype=attribute
            alation_title: Registrations Pexa Opt In Flag

      - name: row_hash
        description: SCD2 column created for comparison using all fields except primary
          keys columns. A hashed value is calculated based on the target columns to
          identify changes in data.
        config:
          meta:
            alation_oid: oid=59627;otype=attribute
            alation_title: Row Hash

      - name: src_delta_extract_ts
        description: Timestamp when extract was inserted in Stage (values correspond
          with column Insterted at in Stage table)
        config:
          meta:
            alation_oid: oid=59324;otype=attribute
            alation_title: Source Delta Extract Timestamp

      - name: state
        description: "The customer\u2019s State they are living in."
        config:
          meta:
            alation_oid: oid=59919;otype=attribute
            alation_title: State

      - name: updated_at
        description: Timestamp when data was updated into curate layer.
        config:
          meta:
            alation_oid: oid=58996;otype=attribute
            alation_title: Updated At
    config:
      meta:
        orig_description: curate table for sendfx pexa client activity
        alation_oid: oid=2949;otype=table
        alation_title: PEXA Client Activity
    data_tests:
      - check_unique_active:
          arguments:
            pk_field_list:
              - master_registration_id

              - registration_id
          config:
            severity: error

      - check_unique_pk_effective_from:
          arguments:
            pk_field_list: master_registration_id, registration_id
          config:
            severity: error

