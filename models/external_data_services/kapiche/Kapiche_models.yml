version: 2

models:
  - name: customer_feedback_master
    columns:
      - name: CSAT_COMMENT
        description: CSAT Comment column is based on Pexa Positives, PEXA Improvements
          and Customer Support Verbatim columns capured in ALL Survey Responses table
          in Salesforce. A row is created for each comment captured in any of these
          3 columns.
        config:
          tags:
            - secure_field=PI_FREE_TEXT_FIELD
          meta:
            alation_oid: oid=83600;otype=attribute
            alation_title: CSAT Comment
        data_tests:
          - not_null

      - name: SUBSCRIBER_NAME
        description: "<div><p>Name of the organization.\_</p><p>Corresponds to Account\
          \ Name in Salesforce which is in fact <a data-oid=\"713\" data-otype=\"\
          glossary_term\" href=\"/document/713/\">Subscriber Full Name \_</a>.\_</p></div>"
        config:
          tags:
            - secure_field=PI_BUSINESS_NAME
          meta:
            alation_oid: oid=83571;otype=attribute
            alation_title: Subscriber Name

      - name: CUSTOMER_TYPE
        description: "<div><p>Potential values are: Practitioner, Majors, Financial\
          \ Institutions, Developer and Government.\_</p><p>These values are derived\
          \ from Channel and Account Management Segment columns in Salesforce as follows:</p><div\
          \ id=\"isPasted\" style=\"height: auto; overflow: hidden;\"><strong>Practitioner:</strong></div><div\
          \ style=\"height: auto; overflow: hidden;\">IF PS_Channel (from account\
          \ table) = \u2018Practitioner\u2019 AND Account Management Segment(from\
          \ account table) = \u2018Tier One\u2019 or \u2018Tier Two\u2019 or \u2018\
          Tier Three\u2019 THEN set the \u2018CustomerType\u2019 field to \u2018Practitioner\u2019\
          </div><div style=\"height: auto; overflow: hidden;\"><strong>Majors:</strong></div><div\
          \ style=\"height: auto; overflow: hidden;\">IF PS_Channel (from account\
          \ table) = \u2018Practitioner\u2019 AND Account Management Segment(from\
          \ account table) = \u2018Major\u2019 THEN set the \u2018Customer Type\u2019\
          \ field to \u2018Major\u2019</div><div style=\"height: auto; overflow: hidden;\"\
          ><strong>Financial institutions:</strong></div><div style=\"height: auto;\
          \ overflow: hidden;\">IF PS_Channel (from account table) = \u2018Financial\
          \ Institution\u2019 THEN set the \u2018CustomerType\u2019 field to \u2018\
          Financial Institution\u2019</div><div style=\"height: auto; overflow: hidden;\"\
          ><strong>Developer':</strong></div><div style=\"height: auto; overflow:\
          \ hidden;\">IF PS_Channel (from account table) = \u2018Practitioner\u2019\
          \ AND Customer Segment Level 1(from account table) = 'Developer' THEN set\
          \ the \u2018Customer Type\u2019 field to 'Developer'</div><div style=\"\
          height: auto; overflow: hidden;\"><strong>Government:</strong></div><div\
          \ style=\"height: auto; overflow: hidden;\">IF PS_Channel (from account\
          \ table) = \u2018Practitioner\u2019 AND Customer Segment Level 1(from account\
          \ table) = 'Government/ Council'THEN set the \u2018Customer Type\u2019 field\
          \ to 'Government/ Council'</div><div style=\"height: auto; overflow: hidden;\"\
          ><br style=\"\"></div></div>"
        config:
          tags:
            - secure_field=PI_FREE_TEXT_FIELD
          meta:
            alation_oid: oid=83564;otype=attribute
            alation_title: Customer Type

      - name: ACCOUNT_OWNER
        description: Full name of account owner.
        config:
          tags:
            - secure_field=PI_FULL_NAME
          meta:
            alation_oid: oid=83567;otype=attribute
            alation_title: Account Owner

      - name: account_management_segment
        description: Segments customers by how they are account managed in PEXA
        config:
          meta:
            alation_oid: oid=83627;otype=attribute
            alation_title: Account Management Segment

      - name: creation_date
        description: Values correspond to <a href="https://onedd-pexa.ap.alationcloud.com/attribute/69789/"
          id="isPasted">CREATED_DATE | Column</a> in <a data-oid="3363" data-otype="table"
          href="/table/3363/">prd_group_curate.salesforce.vw_all_survey_responses
          (View All Survey Responses)</a> and renamed as Creation Date.
        config:
          meta:
            alation_oid: oid=83616;otype=attribute
            alation_title: Creation Date

      - name: csat_rating
        description: "<div><p><span id=\"isPasted\" style=\"\">Customer satisfaction\
          \ score left by a customer.\_</span></p><p><span style=\"\">Values are taken\
          \ from <a data-oid=\"70270\" data-otype=\"attribute\" href=\"/attribute/70270/\"\
          >prd_group_curate.salesforce.vw_all_survey_responses.csat_c (Customer Satisfaction)</a>\
          \ in table <a data-oid=\"3363\" data-otype=\"table\" href=\"/table/3363/\"\
          >prd_group_curate.salesforce.vw_all_survey_responses (View All Survey Responses)</a>\
          \ renamed CSAT Rating.</span></p></div>"
        config:
          meta:
            alation_oid: oid=83604;otype=attribute
            alation_title: CSAT Rating

      - name: customer_segment
        description: PEXA customer segment level 1
        config:
          meta:
            alation_oid: oid=83595;otype=attribute
            alation_title: Customer Segment

      - name: inserted_at
        description: The timestamp indicating when a record was inserted into the
          target table, generated by the system at the time of loading from AWS S3.
        config:
          meta:
            alation_oid: oid=83623;otype=attribute
            alation_title: Inserted At

      - name: related_account_c
        description: Salesforce Account ID used to map the customer feedback to the
          account identifier.
        config:
          meta:
            alation_oid: oid=83586;otype=attribute
            alation_title: Related Account

      - name: src_delta_extract_ts
        description: Specifies the column in the target table used to track the latest
          changes or updates, represented as a timestamp. It is crucial for incremental
          loading strategies to identify new or updated records since the last load
          based on the timestamp.
        config:
          meta:
            alation_oid: oid=83621;otype=attribute
            alation_title: Source Delta Extract Timestamp

      - name: subscriber_id
        description: "<div><p><span id=\"isPasted\">Individual subscriber identifier.</span></p><p><span\
          \ id=\"isPasted\"><a data-oid=\"420\" data-otype=\"glossary_term\" href=\"\
          /document/420/\">ELN Subscriber ID</a>\_</span></p></div>"
        config:
          meta:
            alation_oid: oid=83598;otype=attribute
            alation_title: Subscriber Id

      - name: subscriber_state
        description: <div><p>Abbreviation of the Australian state where the Subscriber
          organization is operating.</p></div>
        config:
          meta:
            alation_oid: oid=83583;otype=attribute
            alation_title: Subscriber State
    description: "<div><p>It is a consolidation of <strong>account table</strong>\
      \ and <strong>all survey responses</strong>.</p><p>To implement this <a data-oid=\"\
      3363\" data-otype=\"table\" href=\"/table/3363/\">prd_group_curate.salesforce.vw_all_survey_responses\
      \ (View All Survey Responses)</a> <span id=\"isPasted\">\_and <a data-oid=\"\
      3347\" data-otype=\"table\" href=\"/table/3347/\">prd_group_curate.salesforce.vw_account\
      \ (View Account)</a>\_ table were joined for model transformation.</span></p><p><span\
      \ id=\"isPasted\">Created views on top of the table which were used to unload\
      \ the file to Kapiche S3.</span></p><p><span>The table name is kept as CUSTOMER_FEEDBACK_MASTER\
      \ to keep it aligned to the existing system in Kapiche.</span></p><p><span>It\
      \ also contains audit columns such as <em id=\"isPasted\">inserted_at</em>,\
      \ transformation logics using columns as per </span><span><a href=\"https://pexa.sharepoint.com/:x:/r/sites/ONEData/_layouts/15/doc2.aspx?sourcedoc=%7B8f4642d4-28af-4bc0-95c5-01bb74ae88b8%7D&action=edit&wdinitialsession=d0a315f5-b8e8-4bc6-32f4-0e79dada1620&wdrldsc=3&wdrldc=1&wdrldr=WorkbookReload%2CServiceCreationTimedOut%2CRefreshingE\"\
      >mapping sheet</a></span><span> which is not required in view. \_</span></p></div>"
    config:
      meta:
        alation_oid: oid=3688;otype=table
        alation_title: Customer Feedback Master
