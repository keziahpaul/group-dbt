      \ Bankwest on title and CBA as Incoming. Used to manage risk in-line with fee-charging\
      \ for CBA.</p><p>More information here:\_\_<a href=\"https://pexa.atlassian.net/wiki/spaces/EDP/pages/1469220494/CBA+Inflight+Refis+-+DNA1017\"\
      \ id=\"isPasted\">CBA Inflight Refis - DNA1017 - Enterprise Data Platform -\
      \ Confluence</a></p></div>"
    columns:
      - name: current_settlement_date
        description: Current settlement date as of reporting date
        config:
          meta:
            alation_oid: oid=104659;otype=attribute
            alation_title: Current Settlement Date

      - name: im_reference
        description: Reference value for incoming mortgagee in workspace
        config:
          meta:
            alation_oid: oid=104678;otype=attribute
            alation_title: Incoming Mortgagee Reference

      - name: incoming_mortgagee
        description: <p id="isPasted">The bank the Purchaser is borrowing money from.</p>
        config:
          meta:
            alation_oid: oid=104637;otype=attribute
            alation_title: Incoming Mortgagee

      - name: mortgagee_on_title
