  - name: CM0346581
    description: "<div><p>Report was designed to replace two monthly reports with\
      \ user details: Email, last login, last password change, and the groups they\
      \ are a part of. There was a report for the retail business (563) and commercial\
      \ (18742). CBA have requested a change to this report with minor field/column\
      \ name changes, combining both retail and commercial and changing to a daily\
      \ delivery. The delivery method is a S3 drop.</p><p>Additional details here:\
      \ \_<a href=\"https://pexa.atlassian.net/wiki/spaces/EDP/pages/1858175418/CBA+User+Sailpoint+-+DNA240201\"\
      \ id=\"isPasted\">CBA User Sailpoint - DNA240201 - Enterprise Data Platform\
      \ - Confluence</a></p></div>"
    columns:
      - name: account enabled
        description: Shows true or false if user account status is active in Exchange
        config:
          meta:
            alation_oid: oid=104622;otype=attribute
            alation_title: Account Enabled

      - name: account identifier
        description: User account username in email address format
        config:
          meta:
            alation_oid: oid=104646;otype=attribute
            alation_title: Account Identifier

      - name: account type
        description: User account type - combination of subscriber ID and subscriber
          name
        config:
          meta:
            alation_oid: oid=104640;otype=attribute
            alation_title: Account Type

      - name: created date
        description: Date of user account creation
        config:
          meta:
            alation_oid: oid=104677;otype=attribute
            alation_title: Created Date

      - name: email
        description: Email address or street address associated with user
        config:
          tags:
            - secure_field=PI_EMAIL
          meta:
            alation_oid: oid=104625;otype=attribute
            alation_title: Email

      - name: employeeid
        description: Empty string for CBA to populate with Employee ID
        config:
          meta:
            alation_oid: oid=104639;otype=attribute
            alation_title: Employee Id

      - name: entitlement description
        description: Application role associated with user eg. Subscriber User, PEXA
          System Administrator
        config:
          meta:
            alation_oid: oid=104634;otype=attribute
            alation_title: Entitlement Description

      - name: given name
        description: First name of user
        config:
          tags:
            - secure_field=PI_NAME
          meta:
            alation_oid: oid=104643;otype=attribute
            alation_title: Given Name

      - name: group
        description: User group identifier combining 'Retail' or 'Commercial' (determined
          by subscriber id) with a single group membership (from application roles,
          workgroups, permissions and planner status).
        config:
          meta:
            alation_oid: oid=104663;otype=attribute
            alation_title: Group

      - name: last logon date
        description: Date of most recent user logon as of reporting date
        config:
          meta:
            alation_oid: oid=104655;otype=attribute
            alation_title: Last Logon Date

      - name: last password change
        description: Date of most recent password change as of reporting date
        config:
          meta:
            alation_oid: oid=104632;otype=attribute
            alation_title: Last Password Change

      - name: networkid
        description: Empty string for CBA to populate with network ID of user
        config:
          meta:
            alation_oid: oid=104630;otype=attribute
            alation_title: Network Id

      - name: surname
        description: Surname of user
        config:
          tags:
            - secure_field=PI_NAME
          meta:
            alation_oid: oid=104644;otype=attribute
            alation_title: Surname
    config:
      meta:
        orig_description: CBA User Sailpoint
        alation_oid: oid=4032;otype=table
        alation_title: CBA User Sailpoint

