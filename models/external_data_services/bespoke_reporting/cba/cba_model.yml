  - name: Workspace_summary_reporting_CBA
    description: This report provides a detailed workspace-level dataset to Commonwealth Bank of Australia (CBA) for workspaces scheduled to settle in the previous business day.
    config:
      materialized: table
    columns:
      - name: reporting_date
        description: 
          Date and time when the report was generated. The report covers workspaces
          scheduled to settle on the previous business day, and all event timestamps
          reflect activity recorded before this reporting timestamp.

      - name: workspace_id
        description: 
          Unique PEXA identifier for the workspace.

      - name: scheduled_settlement_date
        description:
          Date and time the workspace was scheduled to settle as at approximately
          9:20 am on the previous business day, before the first settlement time slot.
          This value determines which workspaces are included in the report.

      - name: current_settlement_date
        description: 
          Current scheduled settlement date and time for the workspace as at the
          report generation time.

      - name: settlement_status
        description: 
          Current PEXA settlement status of the workspace as at the report generation
          time.

      - name: subscriber_id
        description: 
          Unique PEXA identifier for the subscriber participating in the workspace.

      - name: subscriber_name
        description: 
          Registered name of the subscriber participating in the workspace.
        config:
          tags:
            - secure_field=PI_BUSINESS_NAME

      - name: workspace_role
        description: 
          Role in which the subscriber participates in the workspace, such as
          MORTGAGEE_ON_TITLE (outgoing financial institution), INCOMING_MORTGAGEE
          (incoming financial institution), PROPRIETOR_ON_TITLE or
          INCOMING_PROPRIETOR.

      - name: subscriber_reference
        description: 
          Free-text reference assigned to the workspace by the subscriber for its own
          identification and tracking.
        config:
          tags:
            - secure_field=PI_FREE_TEXT_FIELD

      - name: business_unit
        description: 
          Business-unit reference associated with the reported subscriber at the
          individual report-row level.

      - name: transaction_type
        description: 
          Type of property settlement transaction represented by the workspace, for
          example TRANSFER.

      - name: link_type
        description: 
          Indicates whether the settlement is linked to another settlement; for
          example, NOT_LINKED means the workspace is not part of a linked-settlement
          chain.

      - name: jurisdiction
        description: 
          Australian state or territory jurisdiction of the land title associated
          with the workspace, such as NSW, VIC or QLD.

      - name: ess_workspace
        description: 
          Boolean indicator showing whether the workspace uses the new Financial
          Settlement Summary experience.

      - name: first_transfer_doc_created
        description: 
          First date and time a Transfer document was created in the workspace.

      - name: first_stamp_duty_verified
        description: 
          First date and time stamp duty was successfully verified with a compliance
          indicator of Yes.

      - name: stamp_duty_value_change_last_date
        description: 
          Most recent date and time before the report was generated when a new
          stamp-duty amount was recorded, regardless of the compliance-indicator
          outcome.

      - name: first_fi_accept_sett_date
        description: 
          First date and time a Financial Institution workspace role accepted the
          proposed settlement date and time.

      - name: balanced
        description: 
          Difference between total source funds and total disbursement funds in the
          Financial Settlement Schedule. A value of zero indicates that the schedule
          is balanced.

      - name: first_all_accepted_sett_dt
        description: 
          First date and time when all participants then present in the workspace had
          accepted the settlement date. If this predates the Financial Institution's
          acceptance, the relevant FI role may not yet have joined the workspace.

      - name: workspace_created_date
        description: 
          Date and time when the PEXA workspace was created.

      - name: fi_auth_shortfall_update
        description: 
          Most recent date and time before reporting when the Financial Institution
          indicated it held client authority or responsibility for the purchaser
          shortfall by selecting the FRS shortfall indicator.

      - name: first_tfrs_entered
        description: 
          First date and time the Total Funds Required to Settle amount was entered
          for the workspace.

      - name: last_tfrs_update
        description: 
          Most recent date and time before reporting when the Total Funds Required to
          Settle amount was changed.

      - name: first_ready_for_shortfall
        description: 
          First date and time the subscriber marked its financial line-item entries
          as Ready for Shortfall, indicating that the incoming Financial Institution
          could calculate or provide the purchaser shortfall.

      - name: ready_for_shortfall_update
        description: 
          Most recent date and time before reporting when the subscriber marked its
          financial line-item entries as Ready for Shortfall.

      - name: fss_last_signed_date
        description: 
          Most recent date and time before reporting when the subscriber signed the
          Financial Settlement Schedule (FSS). If the subscriber acts in multiple
          roles, the same latest signing time is recorded against each role.

      - name: fi_user_fss_last_sign
        description: 
          Email address or username of the most recent subscriber user to sign the
          Financial Settlement Schedule. If the subscriber acts in multiple roles,
          the same user is recorded against each role.
        config:
          tags:
            - secure_field=PI_EMAIL

      - name: da_sent_flag
        description: 
          Yes/No indicator showing whether a Discharge Authority was sent for the
          workspace.

      - name: da_received_flag
        description: 
          Yes/No indicator showing whether the Mortgagee on Title received the
          Discharge Authority. Receipt indicates whether the outgoing Financial
          Institution can progress its settlement activities.

      - name: loan_docs_sent_flag
        description: 
          Yes/No indicator showing whether loan documents were sent for the workspace.

      - name: loan_docs_received_flag
        description: 
          Yes/No indicator showing whether the Incoming Mortgagee received the loan
          documents. Receipt indicates whether the incoming Financial Institution can
          progress its settlement activities.

      - name: discharge_created
        description: 
          Most recent date and time before reporting when a Discharge of Mortgage
          document was created in the workspace.

      - name: discharge_signed
        description: 
          Most recent date and time before reporting when a Discharge of Mortgage
          document was signed in the workspace.

      - name: loan_payout_last_updated
        description: 
          Most recent date and time before reporting when a Loan Payout destination
          financial line item was created or edited.

      - name: loan_proceeds_last_updated
        description: 
          Most recent date and time before reporting when a Loan Proceeds source
          financial line item was created or edited.

      - name: pur_equity_last_updated
        description: 
          Most recent date and time before reporting when a Purchaser's Equity source
          financial line item was created or edited.

      - name: sign_on_time_metric
        description: 
          Member settlement-readiness metric based on all required document and FSS
          signing':' MET means all documents and the FSS were signed or authorised
          before the first agreed settlement date; NOT MET means at least one was not
          completed by that time; NOT APPLICABLE covers ineligible workspaces or
          roles, including non-transfer workspaces, dual FI roles, unsupported roles,
          or workspaces that did not settle.

      - name: roll_count
        description: 
          Total number of times settlement was rolled across all scheduled settlement
          dates for the workspace. Excludes a failure recorded when settlement is
          rolled from the final time slot of the day.

      - name: rescheduled_count
        description: 
          Total number of times a user rescheduled the settlement to a different date
          or time.

      - name: current_status_outcome
        description: 
          Settlement outcome as at the reporting timestamp. Values':' Settled On Time -
          settled at the first scheduled date and time; Settled On Day - settled on
          the scheduled date after one or more same-day rolls; Settled Post Day -
          settled at least one day after the first scheduled date; Not Settled -
          Future Date - failed to settle and was rescheduled to a future date; Not
          Settled - No Date - failed to settle and had no new date when the report
          ran.