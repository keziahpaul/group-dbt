        config:
          meta:
            alation_oid: oid=104654;otype=attribute
            alation_title: Mortgagee On Title

      - name: mot_reference
        description: Reference value for mortgagee on title in workspace
        config:
          meta:
            alation_oid: oid=104642;otype=attribute
            alation_title: Mortgagee On Title Reference

      - name: reporting_date
        description: Date on which the report was run
