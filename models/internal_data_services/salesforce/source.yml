          - name: inserted_at
            description: Inserted At
            config:
              meta:
                alation_oid: oid=110487;otype=attribute
                alation_title: Inserted At

          - name: name
            description: "<div><p id=\"isPasted\" style=\"\">Name of the workspace\
              \ role.\_</p><p style=\"\">A workspace role governs the representation\
              \ of parties and the documents that a participant can create in a workspace.\
              \ The key workspace roles in PEXA include:</p><ul style=\"\"><li style=\"\
              margin: 0px;\">Applicant - Used to create, extend or withdraw a priority\
              \ notice on a paper dealing. Represents the applicant party.</li><li\
              \ style=\"margin: 0px;\">Consentor - Used to create a CoRD consent (NSW)\
              \ or nomination (VIC) on a paper dealing. Represents the party with\
              \ control of right to deal.</li><li style=\"margin: 0px;\">Caveator\
              \ roles - Used to create/withdraw caveats. Represents the caveator party.</li><li\
