sources:
  - name: api_share
    database: "{{env_var('DBT_EXCHANGE_SHARE_DB')}}"
    schema: "{{env_var('DBT_API_SHARE_SCHEMA')}}"
    tables:
      - name: vw_api_report_logs
        description: view for API report logs from exchange share
        columns:
          - name: uuid
            description: The unique Id generated by teh app, this is not unique for experience APIs
          - name: api
            description: the api name, the experience API records can be uniquely identified using API in combination with uuid
  
  - name: push_not_share
    database: "{{env_var('DBT_EXCHANGE_SHARE_DB')}}"
    schema: "{{env_var('DBT_PUSH_NOTIF_SHARE_SCHEMA')}}"
    tables:
      - name: vw_outbound_notification
        description: view for Push notification table outbound notification
      - name: vw_webhook_registration
        description: view for Push notification table webhook registration
      - name: vw_registration
        description: view for Push notification table registration
